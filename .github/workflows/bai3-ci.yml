name: Bai 3 CI

on:
  push:
    branches:
      - TUAN11
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bai3

    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'bai3/pom.xml'

      - name: Kiem tra masking secret (GitHub tu dong che ***)
        env:
          APP_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
        run: echo "APP_PASSWORD=$APP_PASSWORD"

      - name: Chay test (${{ matrix.browser }})
        env:
          CI: true
          APP_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          APP_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
        run: |
          mvn clean test \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=dev \
            -DsuiteXmlFile=testng-smoke.xml

      - name: Luu ket qua (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            bai3/target/surefire-reports/
            bai3/target/screenshots/
          retention-days: 7
